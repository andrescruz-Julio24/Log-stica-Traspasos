services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sgtl
      POSTGRES_PASSWORD: sgtl_local
      POSTGRES_DB: sgtl
    ports:
      - '5432:5432'
    volumes:
      - sgtl_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sgtl']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sgtl_pg:
